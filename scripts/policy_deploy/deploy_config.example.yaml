# Runnable deploy config for --control_mode policy. Direct-ArmLoco smoke default.
# Local paths are resolved relative to this YAML file.
policy:
  name: basic_locomotion
  run_dir: ../../models/basic_locomotion
  checkpoint: ../../models/basic_locomotion/basic_locomotion_model.pt
  manifest: ../../models/basic_locomotion/bundle_manifest.txt

deploy:
  start_state: ArmLoco        # Passive / FixStand / ArmPreAlign / ArmLoco
  auto_arm_loco: true
  ee_sphere: [0.36, 0.56, 0.0]
  command: [0.0, 0.0, 0.0]   # scripted backend fixed vx/vy/wz
  arm_ema_tau: 0.02

scene:
  # environment_usd overrides the default local Simple Warehouse. A local path,
  # http(s), or omniverse:// URL is accepted. Leave unset to use the default.
  # environment_usd: /absolute/path/to/warehouse.usd

input:
  backend: gamepad            # scripted / keyboard / gamepad
  keyboard:
    v_x_sensitivity: 0.8
    v_y_sensitivity: 0.4
    omega_z_sensitivity: 1.0
  gamepad:
    v_x_sensitivity: 0.3
    v_y_sensitivity: 0.2
    omega_z_sensitivity: 0.3
    dead_zone: 0.01
