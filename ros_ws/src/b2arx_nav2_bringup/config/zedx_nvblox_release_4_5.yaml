# Algorithm overrides copied from NVIDIA Isaac ROS Nvblox release-4.5
# zed_common.yaml + zedx.yaml. Simulation connection parameters are supplied
# by the Stereolabs zed_camera.launch.py launch arguments.
/**:
  ros__parameters:
    general:
      pub_resolution: "CUSTOM"
      pub_downscale_factor: 2.0
      pub_frame_rate: 30.0

    video:
      publish_rgb: true
      publish_left_right: true
      publish_raw: true

    sensors:
      # Project-tested simulation-stream setting: query sensor data at the
      # image timestamp instead of from the independent CURRENT polling
      # thread. This is not an Isaac ROS requirement; keep it together with
      # the GEN_1 override below unless the simulated stream is revalidated.
      sensors_image_sync: true
      publish_mag: false
      publish_baro: false
      publish_temp: false

    depth:
      depth_mode: "ULTRA"
      depth_stabilization: 1
      openni_depth_mode: false
      min_depth: 0.5
      max_depth: 5.0
      point_cloud_freq: 10.0
      depth_confidence: 10
      depth_texture_conf: 100
      remove_saturated_areas: true

    pos_tracking:
      pos_tracking_enabled: true
      # Project-tested companion to sensors_image_sync for this simulated
      # stream. It is deliberately an override, not an upstream requirement.
      pos_tracking_mode: "GEN_1"
      imu_fusion: true
      publish_tf: true
      publish_map_tf: true
      map_frame: "map"
      odometry_frame: "odom"
      set_as_static: false
      set_gravity_as_origin: true
      floor_alignment: false

    mapping:
      mapping_enabled: false

    debug:
      # Stable default for the validated RTX 5090/CUDA 13 host. zed_wrapper
      # 5.4's Managed NITROS publisher reproducibly causes NVIDIA Xid 31/CUDA
      # 700 followed by a libsl_zed.so segfault. Nvblox still consumes the
      # official ZED depth/color sensor_msgs/Image topics. The launch argument
      # disable_zed_nitros can override this for a deliberate future A/B test.
      disable_nitros: true
