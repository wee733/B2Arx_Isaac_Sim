# Derived from NVIDIA Isaac ROS Nvblox release-4.5 carter_nav2.yaml and the
# ROS 2 Jazzy Nav2 navigation_launch.py contract. Planner/controller/plugin
# selections remain official: SmacPlanner2D + Regulated Pure Pursuit +
# nvblox::nav2::NvbloxCostmapLayer. The planner/controller pair is adapted to
# model_29999's command contract: external path-heading control, no absolute
# yaw input, no pure rotation, and either zero or >=0.25 m/s planar speed.

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /b2/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    default_nav_to_pose_bt_xml: "__B2ARX_NAV2_BT_XML__"
    # The official default NavigateThroughPoses tree contains a Spin recovery.
    # This policy cannot execute a zero-linear-velocity yaw command, so expose
    # only the position-goal navigator. WaypointFollower remains available and
    # sequences the same supported NavigateToPose action.
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    error_code_names: ["compute_path_error_code", "follow_path_error_code"]

controller_server:
  ros__parameters:
    use_sim_time: true
    odom_topic: /b2/odom
    controller_frequency: 20.0
    costmap_update_timeout: 0.5
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01
    failure_tolerance: 0.3
    publish_zero_velocity: true
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["position_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 20.0
    position_goal_checker:
      # The policy has no absolute-yaw observation. End navigation on position;
      # RPP supplies yaw-rate feedback only while following the path.
      plugin: "nav2_controller::PositionGoalChecker"
      xy_goal_tolerance: 0.30
      stateful: true
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # A fixed forward command exactly matches the non-zero training tier.
      desired_linear_vel: 0.25
      lookahead_dist: 0.80
      min_lookahead_dist: 0.80
      max_lookahead_dist: 0.80
      lookahead_time: 1.5
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.25
      approach_velocity_scaling_dist: 0.30
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      # Do not let RPP reduce commands into the policy's untrained 0..0.25
      # interval. Collision checking remains active and aborts unsafe arcs.
      use_regulated_linear_velocity_scaling: false
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.42
      regulated_linear_scaling_min_speed: 0.25
      # RPP computes external yaw-rate feedback as wz = vx * curvature. Use the
      # normal 0.80 m carrot so nearby position-only paths can converge. The
      # policy adapter remains the final |wz| / curvature guard.
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.80
      interpolate_curvature_after_goal: false
      use_rotate_to_heading: false
      allow_reversing: false
      max_robot_pose_search_dist: 3.0
      stateful: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      # Keep the rolling local window in the ZED map frame. The ZED VIO
      # map->odom edge contains a vertical component, while the official
      # Nvblox costmap layer only accepts planar inter-frame transforms.
      global_frame: map
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      transform_tolerance: 0.3
      footprint: "[[0.46, 0.30], [0.46, -0.30], [-0.46, -0.30], [-0.46, 0.30]]"
      footprint_padding: 0.01
      always_send_full_costmap: true
      plugins: ["nvblox_layer", "inflation_layer"]
      nvblox_layer:
        plugin: "nvblox::nav2::NvbloxCostmapLayer"
        enabled: true
        nav2_costmap_global_frame: map
        nvblox_map_slice_topic: /nvblox_node/static_map_slice
        convert_to_binary_costmap: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 8.0
        inflation_radius: 0.65

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      width: 60
      height: 60
      origin_x: -30.0
      origin_y: -30.0
      track_unknown_space: false
      transform_tolerance: 0.3
      footprint: "[[0.46, 0.30], [0.46, -0.30], [-0.46, -0.30], [-0.46, 0.30]]"
      footprint_padding: 0.01
      always_send_full_costmap: false
      plugins: ["nvblox_layer", "inflation_layer"]
      nvblox_layer:
        plugin: "nvblox::nav2::NvbloxCostmapLayer"
        enabled: true
        nav2_costmap_global_frame: map
        nvblox_map_slice_topic: /nvblox_node/static_map_slice
        convert_to_binary_costmap: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 8.0
        inflation_radius: 0.65

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    costmap_update_timeout: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      # model_29999 has no absolute-heading observation. Use the position-only
      # 2D search so the RViz goal arrow cannot create a Dubins loop solely to
      # satisfy terminal yaw. RPP supplies heading feedback while walking.
      plugin: "nav2_smac_planner::SmacPlanner2D"
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.30
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      terminal_checking_interval: 5000
      max_planning_time: 5.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: true
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    # Costmap2DROS stamps its oriented map-frame footprint with the latest TF
    # available in the costmap process. The behavior process can briefly have
    # an older independent TF buffer. Feed it the identical static geometry
    # directly in base_link so the official collision checker does not require
    # that cross-process exact-time transform.
    local_footprint_topic: /behavior_footprint
    global_footprint_topic: /behavior_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    # ZED simulation TF normally trails /clock by only tens of milliseconds,
    # but depth/pose load can occasionally push the observed gap near 0.3 s.
    # Keep behavior collision checks tolerant to that measured jitter without
    # timestamp-shifting the official ZED image/pose stream.
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.30
    min_rotational_vel: 0.25
    rotational_acc_lim: 0.3

route_server:
  ros__parameters:
    use_sim_time: true
    route_frame: map
    base_frame: base_link
    global_frame: map
    graph_filepath: ""
    graph_file_loader: GeoJsonGraphFileLoader
    GeoJsonGraphFileLoader:
      plugin: "nav2_route::GeoJsonGraphFileLoader"
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"]
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      max_collision_dist: 3.0
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"

collision_monitor:
  ros__parameters:
    use_sim_time: true
    enabled: false
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel_collision_monitor
    state_topic: collision_monitor_state
    observation_sources: [pointcloud]
    pointcloud:
      type: pointcloud
      topic: /unused_collision_monitor_points
      min_height: 0.15
      max_height: 2.0
      enabled: false
    polygons: [safe_zone]
    safe_zone:
      type: circle
      action_type: stop
      radius: 0.1
      min_points: 1
      enabled: false

docking_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: base_link
    fixed_frame: odom
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: [sim_dock]
    sim_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
    docks: [sim_dock_instance]
    sim_dock_instance:
      type: sim_dock
      frame: map
      pose: [0.0, 0.0, 0.0]

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.25, 0.0, 0.60]
    min_velocity: [0.0, 0.0, -0.60]
    # RPP already generates collision-checked curvature commands. Pass each
    # 20 Hz command through within one smoother tick; the locomotion policy was
    # trained on abrupt 5 s command resampling rather than low-speed ramps.
    max_accel: [5.0, 0.0, 6.0]
    max_decel: [-5.0, 0.0, -6.0]
    odom_topic: /b2/odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5

behavior_footprint_publisher:
  ros__parameters:
    frame_id: base_link
    # Costmap2DROS publishes the padded footprint. Match its explicit 0.01 m
    # padding exactly so behavior collision checks keep identical geometry.
    points: [0.47, 0.31, 0.47, -0.31, -0.47, -0.31, -0.47, 0.31]
    publish_rate_hz: 5.0

# The official velocity smoother intentionally stops publishing after it has
# reached zero.  Keep that behavior upstream, then expose a continuous
# fail-zero transport contract to the Isaac locomotion policy.
cmd_vel_watchdog:
  ros__parameters:
    input_timeout_s: 0.5
    publish_rate_hz: 20.0
