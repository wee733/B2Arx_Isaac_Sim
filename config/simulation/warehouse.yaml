# Interactive core-model profile. Paths are relative to this YAML file.
schema_version: 1

robot_usd: ../../assets/my_B2Arx/my_b2arx/my_robot.usd

environment:
  scene_asset: warehouse
  usd: null
  workspace: true

zed:
  enabled: true
  sdk_stream: true
  save_frames: false
  resolution: HD1200
  fps: 30
  port: 30000
  transport: BOTH
  print_debug: false

# Isaac Sim 5.1 provides an official D455 USD, not a D435i USD.  This graph
# uses its color camera as a D435i interface proxy and publishes renderer depth
# from the same optical center so RGB and depth are actually aligned.
wrist_camera:
  enabled: true
  camera_prim_path: auto
  width: 1280
  height: 720
  frame_skip_count: 0
  frame_id: wrist_camera_color_optical_frame
  color_topic: /wrist_camera/color/image_raw
  color_info_topic: /wrist_camera/color/camera_info
  aligned_depth_topic: /wrist_camera/aligned_depth_to_color/image_raw
  aligned_depth_info_topic: /wrist_camera/aligned_depth_to_color/camera_info

xt32:
  enabled: true
  topic: /lidar_points
  frame_id: hesai_lidar
  show_debug_view: false

ros:
  enabled: true
  domain_id: 23
  nav2: false

policy:
  control_mode: hold
  profile: ../policies/basic_locomotion.yaml
  arm_gain_profile: identified
  print_debug: false

viewer:
  camera: scene
  headless: false

simulation:
  num_envs: 1
  env_spacing: 4.0
  duration: 0.0
  device: cuda:0
  disable_fabric: false
